<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHR PRO</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;padding:12px;color:#fff;min-height:100vh;background:radial-gradient(600px 300px at 15% -10%, rgba(56,189,248,.35), transparent 60%),radial-gradient(600px 300px at 90% 10%, rgba(245,158,11,.28), transparent 60%),radial-gradient(500px 400px at 50% 110%, rgba(139,92,246,.30), transparent 60%),linear-gradient(160deg,#020617 0%, #0b1226 35%, #111c3a 65%, #0a0f22 100%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);background-size:36px 36px}
h1{text-align:center;font-size:20px;text-shadow:0 4px 20px rgba(0,0,0,.5)} h1 span{color:#38bdf8}
.topBar{background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tabs{display:flex;gap:5px;margin:12px 0;flex-wrap:wrap}
.tabs button{flex:1;min-width:62px;padding:11px 2px;border:1px solid rgba(255,255,255,.15);border-radius:14px;font-weight:900;cursor:pointer;background:rgba(255,255,255,.07);color:#fff;font-size:11px}
.tabs button.active{background:linear-gradient(90deg,#0ea5e9,#2563eb);box-shadow:0 6px 18px rgba(14,165,233,.45)}
.add-box{background:rgba(255,255,255,.09);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);padding:14px;border-radius:20px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.search-box{background:#fff;border-radius:14px;padding:4px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.search-box input{background:#fff!important;color:#111!important;border:0!important;margin:0!important;font-weight:900}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(2,6,23,.75);color:#fff;margin:5px 0;outline:none}
select option{color:#111} input::placeholder{color:#94a3b8}
.btn{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(90deg,#22c55e,#16a34a);color:#fff;font-weight:900;font-size:16px;cursor:pointer}
.btn-orange{background:linear-gradient(90deg,#f59e0b,#d97706)} .btn-blue{background:linear-gradient(90deg,#0ea5e9,#2563eb)} .btn-purple{background:linear-gradient(90deg,#8b5cf6,#6d28d9)} .btn-green{background:linear-gradient(90deg,#059669,#047857)}
.card{background:linear-gradient(180deg,#ffffff,#f8fafc);color:#111;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 14px 30px rgba(0,0,0,.35);border:1px solid #e2e8f0} .card h3{margin:0;color:#0284c7;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:18px}
.row{display:flex;gap:6px} .row input,.row select{flex:1;background:#0f172a}
.mini{font-size:13px;background:#f1f5f9;padding:10px;border-radius:11px;margin:5px 0;display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:6px;border:1px solid #e2e8f0}
.total{background:linear-gradient(90deg,#0f172a,#1e293b);color:#fff;padding:14px;border-radius:14px;margin-top:10px;text-align:center;font-weight:900;line-height:1.7;border:1px solid #facc15} .total b{color:#facc15;font-size:20px}
.remainBig{background:linear-gradient(90deg,#0f172a,#1e293b);color:#fff;padding:16px;border-radius:16px;margin-top:10px;text-align:center;border:2px solid #facc15;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.remainBig .label{font-size:14px;font-weight:900;color:#facc15}
.remainBig .val{font-size:32px;font-weight:900;color:#facc15;line-height:1.2;letter-spacing:1px}
.remainBig .sub{font-size:11px;opacity:.7;margin-top:2px}
.remainMe{background:linear-gradient(90deg,#7f1d1d,#991b1b);border-color:#fca5a5}
.remainMe .label{color:#fecaca} .remainMe .val{color:#fff}
.del{background:#ef4444;color:#fff;border:0;padding:7px 10px;border-radius:9px} .printBtn{background:#111;color:#fff;border:0;padding:7px 10px;border-radius:9px}
.smallBtn{padding:9px 8px;border:0;border-radius:11px;font-weight:900;color:#fff;cursor:pointer;font-size:12px}
.editBtn{background:linear-gradient(90deg,#f59e0b,#d97706);color:#fff;border:0;padding:7px 10px;border-radius:10px;font-weight:900;cursor:pointer}
.editSmall{background:#f59e0b;color:#fff;border:0;padding:4px 8px;border-radius:7px;font-size:11px;font-weight:900}
.cartItem{background:#f1f5f9;color:#111;padding:9px;border-radius:10px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;font-weight:700}
.sectionTitle{font-weight:900;font-size:13px;margin:8px 0 4px;color:#facc15}
.profit{background:#dcfce7;color:#166534;padding:3px 8px;border-radius:8px;font-weight:900} .loss{background:#fee2e2;color:#991b1b;padding:3px 8px;border-radius:8px;font-weight:900}
.stock-ok{background:#dcfce7;color:#166534;padding:3px 8px;border-radius:8px;font-weight:900} .stock-low{background:#fef3c7;color:#92400e;padding:3px 8px;border-radius:8px;font-weight:900} .stock-out{background:#fee2e2;color:#991b1b;padding:3px 8px;border-radius:8px;font-weight:900}
.alert-bar{background:#ef4444;color:#fff;padding:10px;border-radius:12px;text-align:center;font-weight:900;margin-bottom:10px}
#lock{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:radial-gradient(600px 300px at 20% 0%,rgba(56,189,248,.35),transparent 60%),linear-gradient(160deg,#020617,#0b1226,#111c3a)}
#lock input{text-align:center;font-size:26px;letter-spacing:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25)}
.lockCard{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);padding:22px;border-radius:24px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
@media print{body{background:#fff!important;color:#000!important;padding:0}body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;top:0;left:0;right:0;padding:20px;display:block!important;color:#000;background:#fff}.no-print{display:none!important}}
#printArea{display:none}
</style>
</head>
<body>
<div id="lock"><div class="lockCard"><h1>💼 <span>BHR PRO</span></h1><h2 style="margin:6px 0">🔐 أدخل كلمة السر</h2><p style="opacity:.7;margin:0">دخول: 1234 &nbsp;|&nbsp; مدير: 9999</p><input id="pass" type="tel" inputmode="numeric" placeholder="1234" maxlength="4" autocomplete="off" style="margin-top:14px"><button class="btn btn-blue" style="margin-top:10px" onclick="var p=document.getElementById('pass').value.trim().replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}); if(p=='1234'||p=='9999'){document.getElementById('lock').style.display='none'}else{document.getElementById('msg').innerText='كلمة السر غلط - اكتب 1234'; document.getElementById('pass').value=''}">دخول 🔓</button><button onclick="document.getElementById('lock').style.display='none'" style="margin-top:10px;padding:10px;width:100%;border:1px solid #facc15;border-radius:12px;background:transparent;color:#facc15;font-weight:900">دخول طوارئ - اضغط هنا لو الزر الأول ما اشتغل</button><p id="msg" style="color:#f87171;font-weight:900"></p></div></div>

<div id="app" class="no-print">
<div class="topBar"><h1 style="margin:0">💼 <span>BHR PRO</span> - نظام المحل <button onclick="document.getElementById('lock').style.display='flex'" style="background:#ef4444;color:#fff;border:0;padding:6px 10px;border-radius:8px;font-size:12px">🔒 قفل</button></h1><p style="text-align:center;margin:6px 0 0;font-size:12px;opacity:.75">✨ نسخة احترافية - الباقي يطلع صح: عليه ولا عليّ</p></div>
<div id="alertArea"></div>
<div class="tabs">
<button id="t1" class="active" onclick="show('z')">ديون الزباين - لهم عليهم</button>
<button id="t2" onclick="show('s')">ديون عليّ - أنا مدين لهم</button>
<button id="t3" onclick="show('g')">📦 البضاعة</button>
<button id="t4" onclick="show('f')">🧾 فواتير</button>
<button id="t5" onclick="show('j')">📊 الجرد</button>
</div>
<div style="display:flex;gap:6px;margin-bottom:10px">
<button onclick="exportData()" style="flex:1;padding:12px;border:0;border-radius:14px;background:#fff;color:#111;font-weight:900">📥 تصدير</button>
<button onclick="document.getElementById('importFile').click()" style="flex:1;padding:12px;border:0;border-radius:14px;background:#facc15;color:#111;font-weight:900">📤 استيراد</button>
<input type="file" id="importFile" style="display:none" onchange="importData(event)">
</div>
<div id="addDebt" class="add-box"><input id="name" placeholder="اسم الزبون / المورد"><button class="btn" onclick="addPerson()">+ إضافة خانه جديدة له</button></div>
<div id="addGoods" class="add-box" style="display:none">
<input id="gName" placeholder="اسم البضاعة - مثال: صنادل نسائي"><input id="gCat" placeholder="رقم صنف البضاعة - مثال: 653-6">
<div class="row"><input id="gBuy" type="number" placeholder="سعر الشراء"><input id="gSell" type="number" placeholder="سعر البيع"></div>
<div class="row"><input id="gQty" type="number" placeholder="الكمية"><input id="gMin" type="number" placeholder="تنبيه عند - مثال: 5"></div>
<button class="btn btn-orange" onclick="addGoodsItem()">+ إضافة بضاعة</button>
</div>
<div id="addInvoice" class="add-box" style="display:none">
<select id="invType" onchange="switchInvType()"><option value="بيع">🧾 فاتورة بيع</option><option value="شراء">🧾 فاتورة شراء</option><option value="سند">🧾 سند قبض - فلوس فقط</option></select>
<div id="boxSell">
<input id="invCustomer" placeholder="اسم الزبون">
<label style="font-size:12px;opacity:.8">اختر الصنف من البضاعة - أو اكتبه يدوي:</label>
<select id="invSelect" onchange="fillPrice()"><option value="">-- اختر من البضاعة --</option></select>
<input id="invItem" placeholder="اسم البضاعة - مثال: صنادل نسائي كعب">
<div class="row"><input id="invQty" type="number" value="1" placeholder="الكمية"><input id="invPrice" type="number" placeholder="سعر البيع"></div>
<button class="btn btn-blue" onclick="addToCart()">+ إضافة هذا الصنف للفاتورة</button>
<div id="cartList"></div>
<div id="cartTotal" class="total" style="display:none">الإجمالي: <b id="cartTotalVal">0</b> ريال</div>
<input id="invNote" placeholder="ملاحظة">
<button class="btn btn-purple" onclick="saveMultiInvoice()">✅ حفظ وطباعة فاتورة البيع</button>
<button onclick="clearCart()" style="width:100%;margin-top:6px;padding:10px;border:0;border-radius:10px;background:#ef4444;color:#fff;font-weight:900">🗑️ مسح الأصناف</button>
</div>
<div id="boxBuy" style="display:none">
<input id="buySupplier" placeholder="اسم المورد">
<div class="sectionTitle">أضف صنف شراء:</div>
<input id="buyItemNo" placeholder="رقم صنف البضاعة - مثال: 653-6">
<input id="buyItem" placeholder="اسم البضاعة - مثال: بواتي أطفال">
<div class="row"><input id="buyQty" type="number" value="1" placeholder="الكمية"><input id="buyPrice" type="number" placeholder="سعر الشراء"></div>
<div class="row"><input id="buySell" type="number" placeholder="سعر البيع - بكم بتبيعها؟"></div>
<button class="btn btn-blue" onclick="addToBuyCart()">+ إضافة هذا الصنف لفاتورة الشراء</button>
<div id="buyCartList"></div>
<div id="buyCartTotal" class="total" style="display:none">إجمالي الشراء: <b id="buyCartTotalVal">0</b> ريال</div>
<input id="buyNote" placeholder="ملاحظة">
<button class="btn btn-purple" onclick="saveBuyInvoice()">✅ حفظ وطباعة فاتورة الشراء</button>
<button onclick="clearBuyCart()" style="width:100%;margin-top:6px;padding:10px;border:0;border-radius:10px;background:#ef4444;color:#fff;font-weight:900">🗑️ مسح الأصناف</button>
</div>
<div id="boxReceipt" style="display:none">
<div class="sectionTitle">🧾 سند قبض - فلوس فقط:</div>
<input id="recName" placeholder="1 - الاسم">
<div class="row"><input id="recAmount" type="number" placeholder="2 - كم المبلغ؟"><select id="recCurrency"><option value="ريال يمني">ريال يمني 🇾🇪</option><option value="ريال سعودي">ريال سعودي 🇸🇦</option><option value="دولار">دولار 💵</option></select></div>
<input id="recFor" placeholder="3 - مقابل ايش؟">
<input id="recNote" placeholder="4 - ملاحظة - اختياري">
<button class="btn btn-green" onclick="saveReceipt()">✅ حفظ وطباعة السند</button>
</div>
</div>
<div id="searchBox" class="search-box" style="display:none"><span style="font-size:20px;padding:0 6px">🔍</span><input id="searchInput" placeholder="ابحث بالاسم أو الصنف..." oninput="render()"><button onclick="clearSearch()" style="background:#ef4444;color:#fff;border:0;border-radius:10px;padding:8px 12px">مسح</button></div>
<div id="list"></div>
<p style="text-align:center;opacity:.6;font-size:12px">BHR PRO © 2026 - كلمة السر: 1234 | مدير: 9999</p>
</div>
<div id="printArea"></div>
<script>
let type='z';
let data={z:[],s:[],g:[],f:[]};
try{ let saved=localStorage.getItem('bhr_pro_v3'); if(saved) data=JSON.parse(saved); }catch(e){}
data.g.forEach(g=>{if(g.qty==null) g.qty=20; if(g.min==null) g.min=5; if(g.sold==null) g.sold=0;});
let cart=[]; let buyCart=[];
function save(){ try{localStorage.setItem('bhr_pro_v3',JSON.stringify(data));}catch(e){} render(); }
function show(t){ type=t; ['t1','t2','t3','t4','t5'].forEach((id,idx)=>document.getElementById(id).className=(['z','s','g','f','j'][idx]===t)?'active':''); document.getElementById('addDebt').style.display=(t=='z'||t=='s')?'block':'none'; document.getElementById('addGoods').style.display=t=='g'?'block':'none'; document.getElementById('addInvoice').style.display=t=='f'?'block':'none'; document.getElementById('searchBox').style.display=t=='g'?'flex':'none'; render(); }
function clearSearch(){document.getElementById('searchInput').value='';render();}
function switchInvType(){ let v=document.getElementById('invType').value; document.getElementById('boxSell').style.display=v==='بيع'?'block':'none'; document.getElementById('boxBuy').style.display=v==='شراء'?'block':'none'; document.getElementById('boxReceipt').style.display=v==='سند'?'block':'none'; }
function addPerson(){let n=document.getElementById('name').value.trim();if(!n) return alert('اكتب الاسم');data[type].push({name:n,inv:[],pay:[]});document.getElementById('name').value='';save();}
function addInv(i){let d=document.getElementById('invD'+i).value||'فاتورة';let a=parseFloat(document.getElementById('invA'+i).value||0);if(!a) return alert('اكتب المبلغ');data[type][i].inv.push({d,a});save();}
function addPay(i){let a=parseFloat(document.getElementById('payA'+i).value||0);if(!a) return alert('اكتب مبلغ الواصل');data[type][i].pay.push({a,date:new Date().toLocaleDateString('ar-YE')});save();}
function delPerson(i){if(confirm('تحذف الخانه؟')){data[type].splice(i,1);save();}}
function editPerson(i){ let p=data[type][i]; let n=prompt('تعديل اسم الزبون:', p.name); if(n!==null && n.trim()){ p.name=n.trim(); save(); } }
function editInv(i,j){ let it=data[type][i].inv[j]; let d=prompt('تعديل البيان:', it.d); if(d===null) return; let a=parseFloat(prompt('تعديل المبلغ:', it.a)); if(!a) return alert('المبلغ غلط'); it.d=d; it.a=a; save(); }
function delInv(i,j){ if(confirm('تحذف هذي الفاتورة؟')){ data[type][i].inv.splice(j,1); save(); } }
function editPay(i,j){ let it=data[type][i].pay[j]; let a=parseFloat(prompt('تعديل مبلغ الواصل:', it.a)); if(!a) return alert('المبلغ غلط'); it.a=a; save(); }
function delPay(i,j){ if(confirm('تحذف هذا الواصل؟')){ data[type][i].pay.splice(j,1); save(); } }
function addGoodsItem(){ let n=document.getElementById('gName').value.trim()||'بضاعة';let c=document.getElementById('gCat').value.trim()||'عام'; let buy=parseFloat(document.getElementById('gBuy').value||0);let sell=parseFloat(document.getElementById('gSell').value||0); let qty=parseInt(document.getElementById('gQty').value||0);let min=parseInt(document.getElementById('gMin').value||5); if(!buy||!sell) return alert('اكتب سعر الشراء وسعر البيع'); if(!qty) return alert('اكتب الكمية'); data.g.push({n,c,buy,sell,qty,min,sold:0}); document.getElementById('gName').value='';document.getElementById('gCat').value='';document.getElementById('gBuy').value='';document.getElementById('gSell').value='';document.getElementById('gQty').value='';document.getElementById('gMin').value=''; save(); }
function delGoods(i){if(confirm('تحذف البضاعة؟')){data.g.splice(i,1);save();}}
function addQty(i){let q=parseInt(prompt('كم حبة بتضيف؟','10'))||0;if(q>0){data.g[i].qty+=q;save();}}
function editGoods(i){ let g=data.g[i]; let n=prompt('اسم البضاعة:', g.n); if(n===null) return; let c=prompt('رقم الصنف:', g.c); if(c===null) return; let buy=parseFloat(prompt('سعر الشراء:', g.buy)); if(!buy) return alert('السعر غلط'); let sell=parseFloat(prompt('سعر البيع:', g.sell)); if(!sell) return alert('السعر غلط'); let qty=parseInt(prompt('الكمية الكلية:', g.qty)); if(isNaN(qty)) return; let min=parseInt(prompt('تنبيه عند:', g.min)); if(isNaN(min)) min=5; g.n=n; g.c=c; g.buy=buy; g.sell=sell; g.qty=qty; g.min=min; save(); }
function stockStatus(g){ let remain=g.qty-g.sold; if(remain<=0) return {txt:'❌ نفذ',cls:'stock-out',remain:0}; if(remain<=g.min) return {txt:'⚠️ قارب ينفذ - باقي '+remain,cls:'stock-low',remain}; return {txt:'✅ متوفر - باقي '+remain,cls:'stock-ok',remain}; }
function checkLoss(buyPrice, sellPrice, itemName){ if(sellPrice >= buyPrice) return true; let loss = buyPrice - sellPrice; let pass = prompt('⛔ تنبيه المدير!\n\nالبضاعة: '+itemName+'\nرأس المال: '+buyPrice+'\nسعر البيع: '+sellPrice+'\nالخسارة: '+loss+'\n\nأدخل كلمة سر المدير:'); if(pass==="9999"){ alert('✅ تمت موافقة المدير'); return true; } else { alert('❌ مرفوضة - ما تم البيع'); return false; } }
function findGoodsByName(text){ text=(text||'').trim(); return data.g.find(g=> g.n===text || g.c===text || text.includes(g.n) || text.includes(g.c) || (g.n+' - '+g.c)===text); }
function findGoodsByNo(no){ return data.g.find(g=> g.c===no); }
function fillPrice(){ let sel=document.getElementById('invSelect'); let idx=sel.value; if(idx==="") return; let g=data.g[parseInt(idx)]; document.getElementById('invItem').value=g.n+' - '+g.c; document.getElementById('invPrice').value=g.sell; }
function refreshSelect(){ let sel=document.getElementById('invSelect'); if(!sel) return; let cur=sel.value; sel.innerHTML='<option value="">-- اختر من البضاعة --</option>'+data.g.map((g,i)=>`<option value="${i}">${g.n} - ${g.c} | بيع ${g.sell} | باقي ${g.qty-g.sold}</option>`).join(''); sel.value=cur; }
function addToCart(){ let item=document.getElementById('invItem').value.trim(); let qty=parseFloat(document.getElementById('invQty').value||1); let price=parseFloat(document.getElementById('invPrice').value||0); if(!item) return alert('اكتب اسم البضاعة'); if(!price) return alert('اكتب السعر'); if(!qty) return alert('اكتب الكمية'); let g=findGoodsByName(item); if(g){ if(!checkLoss(g.buy, price, g.n+' - '+g.c)) return; let remain=g.qty-g.sold; let already=cart.filter(c=>findGoodsByName(c.item)===g).reduce((s,c)=>s+c.qty,0); if(qty+already>remain){ alert('ما معك هالكمية! باقي '+remain); return; } } cart.push({item,qty,price,total:qty*price}); document.getElementById('invItem').value=''; document.getElementById('invPrice').value=''; document.getElementById('invQty').value=1; document.getElementById('invSelect').value=''; renderCart(); }
function delCart(i){ cart.splice(i,1); renderCart(); }
function clearCart(){ cart=[]; renderCart(); }
function renderCart(){ let html=cart.map((c,i)=>`<div class="cartItem"><span>${c.item} - ${c.qty} × ${c.price}</span><span>${c.total} ريال <button onclick="delCart(${i})" style="background:#ef4444;color:#fff;border:0;border-radius:7px;padding:4px 8px">×</button></span></div>`).join(''); document.getElementById('cartList').innerHTML=html; let tot=cart.reduce((s,c)=>s+c.total,0); document.getElementById('cartTotal').style.display=cart.length?'block':'none'; document.getElementById('cartTotalVal').innerText=tot; }
function saveMultiInvoice(){ if(!cart.length) return alert('ضيف صنف واحد على الأقل'); let cust=document.getElementById('invCustomer').value.trim()||'زبون'; let note=document.getElementById('invNote').value||''; let total=cart.reduce((s,c)=>s+c.total,0); cart.forEach(c=>{ let g=findGoodsByName(c.item); if(g) g.sold+=c.qty; }); let num='F-'+(data.f.length+1); let itemText=cart.map(c=> c.item+' ('+c.qty+' × '+c.price+')').join(' + '); let obj={num,t:'بيع',cust,item:itemText,items:JSON.parse(JSON.stringify(cart)),qty:cart.reduce((s,c)=>s+c.qty,0),price:total,total,note,date:new Date().toLocaleDateString('ar-YE')}; data.f.unshift(obj); save(); clearCart(); document.getElementById('invCustomer').value=''; document.getElementById('invNote').value=''; printInvoiceObj(obj); }
function addToBuyCart(){ let no=document.getElementById('buyItemNo').value.trim(); let item=document.getElementById('buyItem').value.trim(); let qty=parseFloat(document.getElementById('buyQty').value||1); let buy=parseFloat(document.getElementById('buyPrice').value||0); let sell=parseFloat(document.getElementById('buySell').value||0); if(!no) return alert('اكتب رقم صنف البضاعة'); if(!item) return alert('اكتب اسم البضاعة'); if(!buy) return alert('اكتب سعر الشراء'); if(!sell) return alert('اكتب سعر البيع'); if(!qty) return alert('اكتب الكمية'); buyCart.push({no,item,qty,buy,sell,price:buy,total:qty*buy}); document.getElementById('buyItemNo').value=''; document.getElementById('buyItem').value=''; document.getElementById('buyQty').value=1; document.getElementById('buyPrice').value=''; document.getElementById('buySell').value=''; renderBuyCart(); }
function delBuyCart(i){ buyCart.splice(i,1); renderBuyCart(); }
function clearBuyCart(){ buyCart=[]; renderBuyCart(); }
function renderBuyCart(){ let html=buyCart.map((c,i)=>`<div class="cartItem"><span>رقم ${c.no} - ${c.item} - ${c.qty} × شراء ${c.buy} | بيع ${c.sell}</span><span>${c.total} <button onclick="delBuyCart(${i})" style="background:#ef4444;color:#fff;border:0;border-radius:7px;padding:4px 8px">×</button></span></div>`).join(''); document.getElementById('buyCartList').innerHTML=html; let tot=buyCart.reduce((s,c)=>s+c.total,0); document.getElementById('buyCartTotal').style.display=buyCart.length?'block':'none'; document.getElementById('buyCartTotalVal').innerText=tot; }
function saveBuyInvoice(){ if(!buyCart.length) return alert('ضيف صنف واحد على الأقل'); let supplier=document.getElementById('buySupplier').value.trim()||'مورد'; let note=document.getElementById('buyNote').value||''; let total=buyCart.reduce((s,c)=>s+c.total,0); buyCart.forEach(c=>{ let g=findGoodsByNo(c.no) || findGoodsByName(c.item); if(g){ g.qty+=c.qty; g.buy=c.buy; g.sell=c.sell; g.c=c.no; } else { data.g.push({n:c.item,c:c.no,buy:c.buy,sell:c.sell,qty:c.qty,min:5,sold:0}); } }); let num='F-'+(data.f.length+1); let itemText=buyCart.map(c=> 'رقم '+c.no+' - '+c.item+' ('+c.qty+' × شراء '+c.buy+' | بيع '+c.sell+')').join(' + '); let obj={num,t:'شراء',cust:supplier,item:itemText,items:buyCart.map(c=>({item:'رقم '+c.no+' - '+c.item,qty:c.qty,price:c.buy,total:c.total,buy:c.buy,sell:c.sell})),qty:buyCart.reduce((s,c)=>s+c.qty,0),price:total,total,note,date:new Date().toLocaleDateString('ar-YE')}; data.f.unshift(obj); save(); clearBuyCart(); document.getElementById('buySupplier').value=''; document.getElementById('buyNote').value=''; printInvoiceObj(obj); }
function saveReceipt(){ let name=document.getElementById('recName').value.trim(); let amount=parseFloat(document.getElementById('recAmount').value||0); let curr=document.getElementById('recCurrency').value; let forWhat=document.getElementById('recFor').value.trim(); let note=document.getElementById('recNote').value.trim(); if(!name) return alert('اكتب الاسم'); if(!amount) return alert('اكتب المبلغ'); if(!forWhat) return alert('اكتب مقابل ايش؟'); let num='F-'+(data.f.length+1); let itemText='مقابل: '+forWhat + (note ? ' - ملاحظة: '+note : ''); let obj={num,t:'سند',cust:name,item:itemText,items:[{item:'مقابل: '+forWhat,qty:1,price:amount,total:amount}],qty:1,price:amount,total:amount,note:note,currency:curr,forWhat:forWhat,date:new Date().toLocaleDateString('ar-YE')}; data.f.unshift(obj); save(); document.getElementById('recName').value=''; document.getElementById('recAmount').value=''; document.getElementById('recFor').value=''; document.getElementById('recNote').value=''; printReceiptObj(obj); }
function printReceiptObj(o){ let curr=o.currency||'ريال يمني'; let html=`<div style="text-align:center;border-bottom:3px solid #000;padding-bottom:10px"><h1 style="margin:0">BHR PRO</h1><h2 style="background:#000;color:#fff;padding:8px;border-radius:8px">سند قبض - ${o.num}</h2><p>${o.date}</p></div><p style="font-size:18px"><b>استلمت من:</b> ${o.cust}</p><p style="font-size:18px"><b>المبلغ:</b> ${o.total} ${curr}</p><p style="font-size:18px"><b>مقابل:</b> ${o.forWhat||o.item}</p>${o.note?`<p style="font-size:16px"><b>ملاحظة:</b> ${o.note}</p>`:''}<div style="border:2px solid #000;padding:12px;margin-top:15px;text-align:center;font-size:22px;font-weight:900">المبلغ: ${o.total} ${curr}</div><div style="display:flex;justify-content:space-between;margin-top:45px"><span>توقيع المحل: ..........</span><span>توقيع المستلم: ..........</span></div>`; document.getElementById('printArea').innerHTML=html; window.print(); }
function delInvoice(i){if(confirm('تحذف الفاتورة؟')){data.f.splice(i,1);save();}}
function editInvoice(i){ let o=data.f[i]; let cust=prompt('اسم الزبون:', o.cust); if(cust===null) return; let item=prompt('البيان / البضاعة:', o.item); if(item===null) return; let qty=parseFloat(prompt('الكمية:', o.qty)); if(!qty) return alert('الكمية غلط'); let price=parseFloat(prompt('السعر:', o.price)); if(!price) return alert('السعر غلط'); o.cust=cust; o.item=item; o.qty=qty; o.price=price; o.total=qty*price; save(); }
function printInvoiceObj(o){ if(o.t==='سند' && o.currency){ printReceiptObj(o); return; } let title=o.t==='بيع'?'فاتورة بيع':o.t==='شراء'?'فاتورة شراء':'سند قبض'; let rows=''; if(o.items && o.items.length){ rows=o.items.map(c=>`<tr><td style="border:1px solid #000;padding:8px">${c.item}</td><td style="border:1px solid #000;padding:8px">${c.qty}</td><td style="border:1px solid #000;padding:8px">${c.price}</td><td style="border:1px solid #000;padding:8px">${c.total}</td></tr>`).join(''); } else { rows=`<tr><td style="border:1px solid #000;padding:10px">${o.item}</td><td style="border:1px solid #000;padding:10px">${o.qty}</td><td style="border:1px solid #000;padding:10px">${o.price}</td><td style="border:1px solid #000;padding:10px"><b>${o.total}</b></td></tr>`; } let html=`<div style="text-align:center;border-bottom:3px solid #000;padding-bottom:10px"><h1 style="margin:0">BHR PRO</h1><h2 style="background:#000;color:#fff;padding:8px;border-radius:8px">${title} - ${o.num}</h2><p>${o.date}</p></div><p><b>الاسم:</b> ${o.cust}</p><table style="width:100%;border-collapse:collapse;margin-top:12px;text-align:center"><tr style="background:#eee"><th style="border:1px solid #000;padding:8px">البيان</th><th style="border:1px solid #000;padding:8px">الكمية</th><th style="border:1px solid #000;padding:8px">السعر</th><th style="border:1px solid #000;padding:8px">الإجمالي</th></tr>${rows}</table><div style="border:2px solid #000;padding:12px;margin-top:15px;text-align:center;font-size:22px;font-weight:900">الإجمالي: ${o.total} ريال</div><div style="display:flex;justify-content:space-between;margin-top:45px"><span>توقيع المحل: ..........</span><span>توقيع المستلم: ..........</span></div>`; document.getElementById('printArea').innerHTML=html; window.print(); }
function printFromGoods(i,mode){ let g=data.g[i]; let remain=g.qty-g.sold; let qty=parseInt(prompt('كم الكمية؟ باقي '+remain,'1'))||1; if(mode==='بيع' && qty>remain){alert('ما معك هالكمية! باقي '+remain);return;} let cust=prompt('اسم الزبون؟','زبون')||'زبون'; let defaultPrice = mode==='بيع'?g.sell:g.buy; let price=parseInt(prompt(mode==='بيع'?'سعر البيع؟ رأس المال '+g.buy:'سعر الشراء؟', defaultPrice))||defaultPrice; if(mode==='بيع'){ if(!checkLoss(g.buy, price, g.n)) return; g.sold+=qty; } else { g.qty+=qty; } let total=qty*price; let num='F-'+(data.f.length+1); let obj={num,t:mode==='بيع'?'بيع':'شراء',cust,item:g.n+' - '+g.c,items:[{item:g.n+' - '+g.c,qty,price,total}],qty,price,total,note:'من البضاعة',date:new Date().toLocaleDateString('ar-YE')}; data.f.unshift(obj); save(); printInvoiceObj(obj); }
function printDebt(i){ let p=data[type][i]; let totInv=p.inv.reduce((s,x)=>s+x.a,0);let totPay=p.pay.reduce((s,x)=>s+x.a,0);let rem=totInv-totPay; let label = type==='s' ? 'الباقي عليّ - أنا مدين له' : 'الباقي عليه - هو مدين لي'; let html=`<div style="text-align:center"><h1>BHR PRO</h1><p>كشف حساب - ${p.name}</p><p>${label}: ${rem} ريال</p></div><p>الفواتير: ${totInv} | المدفوع: ${totPay} | الباقي: ${rem}</p>`; document.getElementById('printArea').innerHTML=html; window.print(); }
function printInventory(){ let rows=data.g.map(g=>{let s=stockStatus(g);return `<tr><td style="border:1px solid #000;padding:8px">${g.n}</td><td style="border:1px solid #000;padding:8px">${g.c}</td><td style="border:1px solid #000;padding:8px">${s.remain}</td><td style="border:1px solid #000;padding:8px">${s.txt}</td></tr>`}).join(''); let html=`<h1 style="text-align:center">BHR PRO - جرد</h1><table style="width:100%;border-collapse:collapse;text-align:center"><tr><th style="border:1px solid #000">البضاعة</th><th style="border:1px solid #000">الصنف</th><th style="border:1px solid #000">الباقي</th><th style="border:1px solid #000">الحالة</th></tr>${rows}</table>`; document.getElementById('printArea').innerHTML=html; window.print(); }
function exportData(){let blob=new Blob([JSON.stringify(data)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BHR-PRO-backup.json';a.click();}
function importData(e){let f=e.target.files[0];if(!f) return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();}catch{alert('الملف غلط')}};r.readAsText(f);}
function render(){ refreshSelect(); let out=data.g.filter(g=>(g.qty-g.sold)<=0); let low=data.g.filter(g=>{let r=g.qty-g.sold;return r>0 && r<=g.min}); let alertHtml=''; if(out.length) alertHtml+=`<div class="alert-bar">❌ نفذ: ${out.map(g=>g.n).join(' ، ')}</div>`; if(low.length) alertHtml+=`<div style="background:#f59e0b;color:#fff;padding:10px;border-radius:12px;text-align:center;font-weight:900;margin-bottom:10px">⚠️ قارب ينفذ: ${low.map(g=>g.n+' باقي '+(g.qty-g.sold)).join(' ، ')}</div>`; document.getElementById('alertArea').innerHTML=alertHtml; let html=''; if(type==='j'){ let totRemain=data.g.reduce((s,g)=>s+(g.qty-g.sold),0); html+=`<div class="total">إجمالي الباقي: <b>${totRemain} حبة</b></div><button class="btn btn-blue" style="margin:10px 0" onclick="printInventory()">🖨️ طباعة الجرد</button>`; data.g.forEach((g,i)=>{let s=stockStatus(g); html+=`<div class="card"><h3>📦 ${g.n} - ${g.c} <button class="editBtn" onclick="editGoods(${i})">✏️ تعديل</button></h3><div class="mini"><span>الباقي:</span><span class="${s.cls}">${s.txt}</span></div><button class="smallBtn" style="background:#22c55e;width:100%" onclick="addQty(${i})">+ إضافة كمية</button></div>`;}); document.getElementById('list').innerHTML=html||'لا توجد بضاعة'; return; } if(type==='f'){ data.f.forEach((o,i)=>{ let currTxt=o.currency?' - '+o.currency:''; html+=`<div class="card"><h3>${o.t} - ${o.num} <button class="editBtn" onclick="editInvoice(${i})">✏️ تعديل</button></h3><div class="mini"><span>${o.cust}</span><b>${o.total}${currTxt}</b></div><div class="mini"><span>${o.item}</span><b>${o.qty} × ${o.price}</b></div><button class="printBtn" onclick="printInvoiceObj(data.f[${i}])">🖨️ طباعة</button> <button class="del" onclick="delInvoice(${i})">حذف</button></div>`;}); document.getElementById('list').innerHTML=html||'لا توجد فواتير'; return; } if(type==='g'){ let q=(document.getElementById('searchInput')?.value||'').trim(); let filtered=data.g.map((g,idx)=>({...g,realIdx:idx})).filter(g=>!q||(g.n+g.c).includes(q)); filtered.forEach(g=>{ let s=stockStatus(g); let profit=g.sell-g.buy; html+=`<div class="card"><h3>📦 ${g.n} <button class="editBtn" onclick="editGoods(${g.realIdx})">✏️ تعديل</button></h3><div class="mini"><span>رقم الصنف:</span><b>${g.c}</b></div><div class="mini"><span>شراء:</span><b>${g.buy}</b></div><div class="mini"><span>بيع:</span><b>${g.sell}</b></div><div class="mini"><span>الفرق:</span>${profit>=0?`<span class="profit">${profit}</span>`:`<span class="loss">${profit} - ممنوع إلا بموافقتك</span>`}</div><div class="mini"><span>المخزون:</span><span class="${s.cls}">${s.txt}</span></div><div style="display:flex;gap:5px;margin-top:8px"><button class="smallBtn" style="flex:1;background:#2563eb" onclick="printFromGoods(${g.realIdx},'بيع')">🧾 بيع</button><button class="smallBtn" style="flex:1;background:#dc2626" onclick="printFromGoods(${g.realIdx},'شراء')">🧾 شراء</button><button class="smallBtn" style="flex:1;background:#22c55e" onclick="addQty(${g.realIdx})">+ كمية</button></div><button class="del" style="margin-top:8px" onclick="delGoods(${g.realIdx})">حذف البضاعة</button></div>`;}); document.getElementById('list').innerHTML=html||'لا توجد بضاعة'; return; } data[type].forEach((p,i)=>{ let totInv=p.inv.reduce((s,x)=>s+x.a,0);let totPay=p.pay.reduce((s,x)=>s+x.a,0);let rem=totInv-totPay; let isOweMe = type==='s'; let label = isOweMe ? 'الباقي عليّ - أنا مدين له' : 'الباقي عليه - هو مدين لي'; let sub = isOweMe ? 'الفواتير '+totInv+' - اللي دفعته '+totPay+' = باقي عليّ '+rem : 'الفواتير '+totInv+' - اللي دفع '+totPay+' = باقي عليه '+rem; let remainClass = isOweMe ? 'remainBig remainMe' : 'remainBig'; let payLabel = isOweMe ? 'كم دفعت له؟' : 'كم دفع؟'; let payBtn = isOweMe ? '+ دفعت له' : '+ واصل'; let invLabel = isOweMe ? 'الفواتير اللي عليّ:' : 'الفواتير:'; let paidLabel = isOweMe ? 'اللي دفعته له:' : 'المدفوع:'; let invList=p.inv.map((x,j)=>`<div class="mini"><span>${x.d} - ${x.a} ريال</span><span><button class="editSmall" onclick="editInv(${i},${j})">✏️</button> <button class="editSmall" style="background:#ef4444" onclick="delInv(${i},${j})">×</button></span></div>`).join(''); let payList=p.pay.map((x,j)=>`<div class="mini"><span>واصل - ${x.a} ريال - ${x.date||''}</span><span><button class="editSmall" onclick="editPay(${i},${j})">✏️</button> <button class="editSmall" style="background:#ef4444" onclick="delPay(${i},${j})">×</button></span></div>`).join(''); html+=`<div class="card"><h3>👤 ${p.name} <button class="editBtn" onclick="editPerson(${i})">✏️ تعديل الاسم</button></h3><div class="mini"><span>${invLabel}</span><b>${totInv}</b></div><div class="mini"><span>${paidLabel}</span><b>${totPay}</b></div><div class="${remainClass}"><div class="label">${label}</div><div class="val">${rem} ريال</div><div class="sub">${sub}</div></div>${invList}${payList}<div class="row"><input id="invD${i}" placeholder="ايش اخذ؟"><input id="invA${i}" type="number" placeholder="مبلغ"><button onclick="addInv(${i})" style="background:#0ea5e9;color:#fff;border:0;border-radius:10px;padding:0 14px">+</button></div><div class="row"><input id="payA${i}" type="number" placeholder="${payLabel}"><button onclick="addPay(${i})" style="background:#22c55e;color:#fff;border:0;border-radius:10px;padding:0 14px">${payBtn}</button></div><button class="printBtn" style="margin-top:8px" onclick="printDebt(${i})">🖨️ طباعة كشف</button> <button class="del" onclick="delPerson(${i})">حذف</button></div>`;}); document.getElementById('list').innerHTML=html||'لا يوجد أحد'; }
render();
</script>
</body>
</html>
